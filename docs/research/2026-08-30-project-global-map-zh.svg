  <line x1="60" y1="968" x2="90" y2="968" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="96" y="972" font-size="11" fill="#6b7280">主流程 · 数据往哪走</text>
  <line x1="240" y1="968" x2="270" y2="968" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="276" y="972" font-size="11" fill="#6b7280">指挥与调用</text>
  <line x1="390" y1="968" x2="420" y2="968" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="426" y="972" font-size="11" fill="#6b7280">Agent 生成草稿</text>
  <line x1="570" y1="968" x2="600" y2="968" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="606" y="972" font-size="11" fill="#6b7280">你批准后发布</text>
  <line x1="730" y1="968" x2="760" y2="968" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="766" y="972" font-size="11" fill="#6b7280">分组 / 边界</text>
  <text x="1140" y="972" text-anchor="end" font-size="10" fill="#9ca3af">依据 README · spec · CONTEXT.md 整理 · 2026-08-30</text>
